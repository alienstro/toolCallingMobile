<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiteRT Chat Android Screens</title>
  <link rel="stylesheet" href="css/litert.css">
</head>
<body>
  <main class="launcher">
    <header class="launcher-header">
      <div>
        <h1>LiteRT Chat Android screens</h1>
        <p>Four Android utility screens for local model chat, installation, runtime controls, and diagnostics. Open any screen directly or compare the framed surfaces below.</p>
      </div>
      <span class="runtime-pill"><span class="status-dot tone-accent"></span>Local model ready</span>
    </header>

    <section class="frame-grid" aria-label="Prototype screens">
      <article class="frame-card">
        <div class="frame-label"><span>Chat</span><a class="mini-chip" href="screens/chat.html">Open</a></div>
        <div class="phone-frame"><iframe title="Chat screen" src="screens/chat.html" loading="lazy"></iframe></div>
      </article>
      <article class="frame-card">
        <div class="frame-label"><span>Models</span><a class="mini-chip" href="screens/models.html">Open</a></div>
        <div class="phone-frame"><iframe title="Models screen" src="screens/models.html" loading="lazy"></iframe></div>
      </article>
      <article class="frame-card">
        <div class="frame-label"><span>Settings</span><a class="mini-chip" href="screens/settings.html">Open</a></div>
        <div class="phone-frame"><iframe title="Settings screen" src="screens/settings.html" loading="lazy"></iframe></div>
      </article>
      <article class="frame-card">
        <div class="frame-label"><span>Diagnostics</span><a class="mini-chip" href="screens/diagnostics.html">Open</a></div>
        <div class="phone-frame"><iframe title="Diagnostics screen" src="screens/diagnostics.html" loading="lazy"></iframe></div>
      </article>
    </section>
  </main>
</body>
</html>
